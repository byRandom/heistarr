[package]
name = "heistarr-server"
description = "Heistarr server: API, library, indexers, downloader and importer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "heistarr"
path = "src/main.rs"

[dependencies]
heistarr-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
tracing-appender = "0.2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart"] }
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
