[package]
name = "heistarr-web"
description = "Heistarr web UI (Leptos, compiled to WebAssembly)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heistarr-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Navigator", "Clipboard", "Location"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
